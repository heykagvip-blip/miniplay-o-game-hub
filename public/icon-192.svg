<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="mp-bg-192" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="mp-gloss-192" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mp-play-192" x1="110" y1="70" x2="145" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="mp-ctrl-192" x1="45" y1="55" x2="150" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="mp-shadow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="192" height="192" rx="48" fill="url(#mp-bg-192)" />

  <!-- Glass Gloss Highlight -->
  <path d="M 4 52 C 4 25.5 25.5 4 52 4 H 140 C 166.5 4 188 25.5 188 52 V 76 C 140 100 52 100 4 76 Z" fill="url(#mp-gloss-192)" />
  <rect x="2" y="2" width="188" height="188" rx="46" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4" fill="none" />

  <!-- Gamepad Emblem Scale 4.09x (44 -> 180) -->
  <g transform="translate(4, 4) scale(4.09)" filter="url(#mp-shadow-192)">
    <path
      d="M 14 12.5 C 16.8 12.5 19 14.8 22 14.8 C 25 14.8 27.2 12.5 30 12.5 C 34.2 12.5 36.8 15.6 36.8 19.5 C 36.8 24 35 28.5 32.8 31.5 C 31 33.8 28 33.2 26.2 30.5 C 24.6 28 23.5 24.5 22 24.5 C 20.5 24.5 19.4 28 17.8 30.5 C 16 33.2 13 33.8 11.2 31.5 C 9 28.5 7.2 24 7.2 19.5 C 7.2 15.6 9.8 12.5 14 12.5 Z"
      fill="url(#mp-ctrl-192)"
    />

    <!-- D-Pad (+) -->
    <rect x="11.5" y="19.5" width="7" height="3" rx="1" fill="#4338ca" />
    <rect x="13.5" y="17.5" width="3" height="7" rx="1" fill="#4338ca" />
    <circle cx="15" cy="21" r="0.8" fill="#e0e7ff" />

    <!-- Play Button (▶) -->
    <path
      d="M 26.5 17.2 C 26.5 16.5 27.3 16 27.9 16.4 L 32.8 19.8 C 33.4 20.2 33.4 21.2 32.8 21.6 L 27.9 25 C 27.3 25.4 26.5 24.9 26.5 24.2 Z"
      fill="url(#mp-play-192)"
    />

    <!-- Center LED Status Jewels -->
    <circle cx="20.5" cy="18.5" r="1.1" fill="#6366f1" opacity="0.85" />
    <circle cx="23.5" cy="18.5" r="1.1" fill="#ec4899" opacity="0.85" />
    <circle cx="22" cy="21.5" r="1.3" fill="#06b6d4" />
  </g>
</svg>
